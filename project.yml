name: Sichtwort
options:
  bundleIdPrefix: at.legasthenie
  developmentLanguage: de
  deploymentTarget:
    iOS: "16.0"
targets:
  Sichtwort:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.legasthenie.sichtwort
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "10"     # VOR JEDEM UPLOAD HOCHZÄHLEN!
        DEVELOPMENT_TEAM: FQZ492F2YC
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "at.legasthenie.sichtwort AppStore"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Sichtwort
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleLocalizations: [de, en]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - Fonts/OpenDyslexic-Regular.otf
          - Fonts/OpenDyslexic-Bold.otf
          - Fonts/Lexend-Regular.ttf
